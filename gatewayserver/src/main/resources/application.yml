server:
  port: 8072

spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://${CONFIG_HOST:localhost}:8071/"
  cloud:
    kubernetes:
      discovery:
        # Resolves service names through the in-cluster DiscoveryServer.
        # Upstream: DiscoveryClient. Downstream: Kubernetes service metadata.
        discovery-server-url: ${DISCOVERY_SERVER_URL:http://spring-cloud-kubernetes-discoveryserver}
        enabled: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 25s
          discovery:
            locator:
              enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      connect-timeout: 2s
      timeout: 1s
