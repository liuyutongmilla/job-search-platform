server:
  port: 8761

spring:
  application:
    name: "eurekaserver"

eureka:
  instance:
    hostname: localhost
  client:
    # 注册中心自己不需要注册到别人那里，也不需要拉取注册表
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: "http://${eureka.instance.hostname}:${server.port}/eureka/"
  server:
    # 本地开发关掉自我保护，否则你停掉一个服务后 Eureka 会固执地认为它还活着
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
