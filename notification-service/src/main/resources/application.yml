server:
  port: 9010

spring:
  application:
    name: "notification-service"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: "optional:configserver:http://${CONFIG_HOST:localhost}:8071/"

  cloud:
    function:
      definition: emailNotification;smsNotification
    stream:
      bindings:
        emailNotification-in-0:
          destination: match-computed
          group: ${spring.application.name}-email
        smsNotification-in-0:
          destination: match-computed
          group: ${spring.application.name}-sms
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKERS:localhost:9092}
        bindings:
          emailNotification-in-0:
            consumer:
              enableDlq: true
              dlqName: match-computed.email.dlq
              autoCommitOnError: false
          smsNotification-in-0:
            consumer:
              enableDlq: true
              dlqName: match-computed.sms.dlq
              autoCommitOnError: false

notification:
  channels:
    email: true
    sms: false
  throttle:
    windowMinutes: 60
    maxPerWindow: 3

