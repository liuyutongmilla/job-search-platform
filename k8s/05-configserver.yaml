# Centralized configuration service.
# Upstream: application services at startup. Downstream: service configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
  namespace: jobsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          image: jobsearch/configserver:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8071
          env:
            - name: CONFIG_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: CONFIG_ENCRYPT_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8071
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8071
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: configserver
  namespace: jobsearch
spec:
  selector:
    app: configserver
  ports:
    - port: 8071
      targetPort: 8071
  type: ClusterIP
