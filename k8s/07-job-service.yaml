# Job catalog service.
# Upstream: gatewayserver and matching-service. Downstream: PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
  namespace: jobsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
    spec:
      containers:
        - name: job-service
          image: jobsearch/job-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_PASSWORD
            - name: CONFIG_HOST
              value: "configserver"
            - name: DB_HOST
              value: "postgres"
            - name: REDIS_HOST
              value: "redis"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: job-service
  namespace: jobsearch
spec:
  selector:
    app: job-service
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
