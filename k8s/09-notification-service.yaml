# Event-driven notification worker.
# Upstream: Kafka match events. Downstream: notification delivery adapters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: jobsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: jobsearch/notification-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9010
          env:
            - name: CONFIG_HOST
              value: "configserver"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9010
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9010
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: jobsearch
spec:
  selector:
    app: notification-service
  ports:
    - port: 9010
      targetPort: 9010
  type: ClusterIP
