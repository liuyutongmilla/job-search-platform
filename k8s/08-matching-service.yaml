# Job matching orchestrator.
# Upstream: gatewayserver. Downstream: user-service, job-service, ai-service, PostgreSQL, and Kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: jobsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
        - name: matching-service
          image: jobsearch/matching-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: DISCOVERY_SERVER_URL
              value: "http://spring-cloud-kubernetes-discoveryserver"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_PASSWORD
            - name: CONFIG_HOST
              value: "configserver"
            - name: DB_HOST
              value: "postgres"
            - name: REDIS_HOST
              value: "redis"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: jobsearch
spec:
  selector:
    app: matching-service
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
