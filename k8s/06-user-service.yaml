# User and resume service.
# Upstream: gatewayserver and matching-service. Downstream: PostgreSQL and Kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: jobsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: jobsearch/user-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_PASSWORD
            - name: CONFIG_HOST
              value: "configserver"
            - name: DB_HOST
              value: "postgres"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: RESUME_STORAGE_DIR
              value: "/data/resumes"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: resume-storage
              mountPath: /data/resumes
      volumes:
        - name: resume-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: jobsearch
spec:
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
