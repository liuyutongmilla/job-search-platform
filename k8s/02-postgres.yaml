# PostgreSQL persistence infrastructure.
# Upstream: persistence-enabled services. Downstream: persistent volume storage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: jobsearch
data:
  00-init.sql: |
    CREATE DATABASE userdb OWNER jobsearch;
    CREATE DATABASE jobdb OWNER jobsearch;
    CREATE DATABASE matchingdb OWNER jobsearch;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jobsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobsearch-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jobsearch"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: postgres-init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jobsearch
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
