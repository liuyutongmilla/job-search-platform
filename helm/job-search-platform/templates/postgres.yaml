apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  00-init.sql: |
    CREATE DATABASE userdb OWNER jobsearch;
    CREATE DATABASE jobdb OWNER jobsearch;
    CREATE DATABASE matchingdb OWNER jobsearch;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ containerPort: {{ .Values.postgres.port }} }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql/data }
            - { name: postgres-init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "jobsearch"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: postgres-init
          configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: {{ .Values.postgres.port }}, targetPort: {{ .Values.postgres.port }} }]
