apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.userService.name }}
  labels:
    app: {{ .Values.services.userService.name }}
    {{- include "job-search-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.userService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.services.userService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.userService.name }}
    spec:
      containers:
        - name: {{ .Values.services.userService.name }}
          image: {{ .Values.services.userService.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.userService.port }}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DB_PASSWORD
            - name: CONFIG_HOST
              value: configserver
            - name: DB_HOST
              value: postgres
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: RESUME_STORAGE_DIR
              value: /data/resumes
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.services.userService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.services.userService.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: resume-storage
              mountPath: /data/resumes
      volumes:
        - name: resume-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.userService.name }}
spec:
  selector:
    app: {{ .Values.services.userService.name }}
  ports:
    - name: http
      port: {{ .Values.services.userService.port }}
      targetPort: {{ .Values.services.userService.port }}
  type: ClusterIP
