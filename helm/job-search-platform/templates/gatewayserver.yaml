apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayserver
  labels:
    app: gatewayserver
    {{- include "job-search-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.gatewayserver.replicas }}
  selector:
    matchLabels:
      app: gatewayserver
  template:
    metadata:
      labels:
        app: gatewayserver
    spec:
      containers:
        - name: gatewayserver
          image: {{ .Values.services.gatewayserver.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.gatewayserver.port }}
          env:
            - name: DISCOVERY_SERVER_URL
              value: http://spring-cloud-kubernetes-discoveryserver
            - name: CONFIG_HOST
              value: configserver
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.services.gatewayserver.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.services.gatewayserver.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayserver
spec:
  selector:
    app: gatewayserver
  ports:
    - name: http
      port: {{ .Values.services.gatewayserver.port }}
      targetPort: {{ .Values.services.gatewayserver.port }}
  type: ClusterIP
