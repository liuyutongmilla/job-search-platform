apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.matchingService.name }}
  labels:
    app: {{ .Values.services.matchingService.name }}
    {{- include "job-search-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.matchingService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.services.matchingService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.matchingService.name }}
    spec:
      containers:
        - name: {{ .Values.services.matchingService.name }}
          image: {{ .Values.services.matchingService.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.matchingService.port }}
          env:
            - name: DISCOVERY_SERVER_URL
              value: http://spring-cloud-kubernetes-discoveryserver
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DB_PASSWORD
            - name: CONFIG_HOST
              value: configserver
            - name: DB_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BROKERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.services.matchingService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.services.matchingService.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.matchingService.name }}
spec:
  selector:
    app: {{ .Values.services.matchingService.name }}
  ports:
    - name: http
      port: {{ .Values.services.matchingService.port }}
      targetPort: {{ .Values.services.matchingService.port }}
  type: ClusterIP
