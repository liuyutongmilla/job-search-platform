apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
  labels:
    app: configserver
    {{- include "job-search-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.configserver.replicas }}
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          image: {{ .Values.services.configserver.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.configserver.port }}
          env:
            - name: CONFIG_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CONFIG_ENCRYPT_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.services.configserver.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.services.configserver.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: configserver
spec:
  selector:
    app: configserver
  ports:
    - name: http
      port: {{ .Values.services.configserver.port }}
      targetPort: {{ .Values.services.configserver.port }}
  type: ClusterIP
