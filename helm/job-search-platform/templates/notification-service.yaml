apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.notificationService.name }}
  labels:
    app: {{ .Values.services.notificationService.name }}
    {{- include "job-search-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.notificationService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.services.notificationService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.notificationService.name }}
    spec:
      containers:
        - name: {{ .Values.services.notificationService.name }}
          image: {{ .Values.services.notificationService.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.notificationService.port }}
          env:
            - name: CONFIG_HOST
              value: configserver
            - name: KAFKA_BROKERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.services.notificationService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.services.notificationService.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.notificationService.name }}
spec:
  selector:
    app: {{ .Values.services.notificationService.name }}
  ports:
    - name: http
      port: {{ .Values.services.notificationService.port }}
      targetPort: {{ .Values.services.notificationService.port }}
  type: ClusterIP
