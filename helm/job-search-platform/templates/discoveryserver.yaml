apiVersion: v1
kind: ServiceAccount
metadata:
  name: spring-cloud-kubernetes-discoveryserver
  labels:
    {{- include "job-search-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spring-cloud-kubernetes-discoveryserver-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-reader
subjects:
  - kind: ServiceAccount
    name: spring-cloud-kubernetes-discoveryserver
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-cloud-kubernetes-discoveryserver
spec:
  replicas: {{ .Values.discoveryServer.replicas }}
  selector:
    matchLabels: { app: spring-cloud-kubernetes-discoveryserver }
  template:
    metadata:
      labels: { app: spring-cloud-kubernetes-discoveryserver }
    spec:
      serviceAccountName: spring-cloud-kubernetes-discoveryserver
      containers:
        - name: spring-cloud-kubernetes-discoveryserver
          image: {{ .Values.discoveryServer.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_CLOUD_KUBERNETES_DISCOVERY_NAMESPACES_0
              value: {{ .Release.Namespace | quote }}
          ports:
            - containerPort: {{ .Values.discoveryServer.port }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.discoveryServer.port }} }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.discoveryServer.port }} }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: spring-cloud-kubernetes-discoveryserver
spec:
  selector: { app: spring-cloud-kubernetes-discoveryserver }
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.discoveryServer.port }}
  type: ClusterIP
