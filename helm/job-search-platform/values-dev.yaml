# Development overrides for the Job Search Platform Helm chart.
# Usage:
#   helm upgrade --install job-search ./helm/job-search-platform \
#     -f ./helm/job-search-platform/values-dev.yaml \
#     --namespace jobsearch-dev --create-namespace

services:
  configserver:
    replicas: 1
  userService:
    replicas: 1
  jobService:
    replicas: 1
  matchingService:
    replicas: 1
  notificationService:
    replicas: 1
  gatewayserver:
    replicas: 1
    publicService:
      enabled: true
      type: NodePort
      nodePort: 30072

postgres:
  replicas: 1

redis:
  replicas: 1

kafka:
  replicas: 1
