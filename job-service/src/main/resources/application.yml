server:
  port: 8090

spring:
  application:
    name: "job-service"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  config:
    import: "optional:configserver:http://${CONFIG_HOST:localhost}:8071/"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/jobdb
    username: ${DB_USER:jobsearch}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  cloud:
    stream:
      bindings:
        jobPosted-out-0:
          destination: job-posted
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKERS:localhost:9092}

job:
  search:
    maxResults: 50
    defaultPageSize: 20
  contactDetails:
    name: "Job Service Team (local fallback)"
    email: "job-team@jobsearch.example.com"

