server:
  port: 8080

spring:
  application:
    name: "user-service"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: "optional:configserver:http://${CONFIG_HOST:localhost}:8071/"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/userdb
    username: ${DB_USER:jobsearch}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  cloud:
    function:
      definition: resumeParsed
    stream:
      bindings:
        resumeUploaded-out-0:
          destination: resume-uploaded
        resumeParsed-in-0:
          destination: resume-parsed
          group: ${spring.application.name}
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKERS:localhost:9092}
        bindings:
          resumeParsed-in-0:
            consumer:
              enableDlq: true
              dlqName: resume-parsed.user-service.dlq
              autoCommitOnError: false

user:
  resume:
    storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}

