server:
  port: 9000

spring:
  application:
    name: "matching-service"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    import: "optional:configserver:http://${CONFIG_HOST:localhost}:8071/"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/matchingdb
    username: ${DB_USER:jobsearch}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false

  cloud:
    kubernetes:
      discovery:
        # Resolves service names through the in-cluster DiscoveryServer.
        # Upstream: DiscoveryClient. Downstream: Kubernetes service metadata.
        discovery-server-url: ${DISCOVERY_SERVER_URL:http://spring-cloud-kubernetes-discoveryserver}
        enabled: true
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
          ai-service:
            connectTimeout: 3000
            readTimeout: 20000
    stream:
      bindings:
        matchComputed-out-0:
          destination: match-computed
      kafka:
        binder:
          brokers:
            - ${KAFKA_BROKERS:localhost:9092}

